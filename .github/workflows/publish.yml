name: Publish

on:
  push:
    tags:
      - 'v*'

env:
  PUBLISH_DELAY: 30

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      NPM_TAG: ${{ contains(github.ref, 'beta') && 'beta' || 'latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm
        run: npm install -g npm@11.17.0

      # eslint-config
      - name: Install eslint-config
        run: npm i --ignore-scripts
        working-directory: npm/packages/eslint-config
      - name: Publish eslint-config
        continue-on-error: true
        run: npm publish --provenance --tag "$NPM_TAG"
        working-directory: npm/packages/eslint-config
      - name: Wait ${{ env.PUBLISH_DELAY }}s after eslint-config
        run: sleep "$PUBLISH_DELAY"

      # library-build
      - name: Install library-build
        run: npm i --ignore-scripts
        working-directory: npm/packages/library-build
      - name: Build library-build
        run: npm run build
        working-directory: npm/packages/library-build
      - name: Publish library-build
        continue-on-error: true
        run: npm publish --provenance --tag "$NPM_TAG"
        working-directory: npm/packages/library-build
      - name: Wait ${{ env.PUBLISH_DELAY }}s after library-build
        run: sleep "$PUBLISH_DELAY"

      # utils
      - name: Install utils
        run: npm i --ignore-scripts
        working-directory: npm/packages/utils
      - name: Build utils
        run: npm run build
        working-directory: npm/packages/utils
      - name: Publish utils
        continue-on-error: true
        run: npm publish --provenance --tag "$NPM_TAG"
        working-directory: npm/packages/utils
      - name: Wait ${{ env.PUBLISH_DELAY }}s after utils
        run: sleep "$PUBLISH_DELAY"

      # autosuggest
      - name: Install autosuggest
        run: npm i --ignore-scripts
        working-directory: npm/packages/autosuggest
      - name: Build autosuggest
        run: npm run build
        working-directory: npm/packages/autosuggest
      - name: Publish autosuggest
        continue-on-error: true
        run: npm publish --provenance --tag "$NPM_TAG"
        working-directory: npm/packages/autosuggest
      - name: Wait ${{ env.PUBLISH_DELAY }}s after autosuggest
        run: sleep "$PUBLISH_DELAY"

      # file-upload
      - name: Install file-upload
        run: npm i --ignore-scripts
        working-directory: npm/packages/file-upload
      - name: Build file-upload
        run: npm run build
        working-directory: npm/packages/file-upload
      - name: Publish file-upload
        continue-on-error: true
        run: npm publish --provenance --tag "$NPM_TAG"
        working-directory: npm/packages/file-upload
